name: meddesk

x-database-environment: &database-environment
  POSTGRES_USER: ${POSTGRES_USER:-meddesk}
  POSTGRES_DB: ${POSTGRES_DB:-meddesk}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env to generate local credentials}

services:
  postgres:
    image: postgres:18-alpine
    environment: *database-environment
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    shm_size: 128mb

  migrate:
    image: migrate/migrate:v4.19.1
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-meddesk}:${POSTGRES_PASSWORD:?Run make env}@postgres:5432/${POSTGRES_DB:-meddesk}?sslmode=disable
      - up
    volumes:
      - ./backend/db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-meddesk}:${POSTGRES_PASSWORD:?Run make env}@postgres:5432/${POSTGRES_DB:-meddesk}?sslmode=disable
      HTTP_ADDR: :8081
      HTTP_REQUEST_TIMEOUT: ${HTTP_REQUEST_TIMEOUT:-10s}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-15s}
      MEDIA_DIR: /var/lib/meddesk/media
      MEDIA_UPLOAD_TIMEOUT: ${MEDIA_UPLOAD_TIMEOUT:-2m}
      MEDIA_STREAM_TIMEOUT: ${MEDIA_STREAM_TIMEOUT:-5m}
      MEDIA_MAX_VIDEO_BYTES: ${MEDIA_MAX_VIDEO_BYTES:-104857600}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      SESSION_TTL: ${SESSION_TTL:-8h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    volumes:
      - media_data:/var/lib/meddesk/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/api/v1/ready]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  frontend:
    build:
      context: ./frontend
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  nginx:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports:
      - 127.0.0.1:${GATEWAY_PORT:-8080}:8080
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/gateway-health]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  seed:
    image: postgres:18-alpine
    profiles: [tools]
    environment:
      APP_ENV: ${APP_ENV:-development}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-meddesk}
      PGDATABASE: ${POSTGRES_DB:-meddesk}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run make env}
    volumes:
      - ./backend/db/seeds:/seeds:ro
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        test "$$APP_ENV" = development || { echo 'Reference seed requires APP_ENV=development' >&2; exit 1; }
        exec psql -X --set ON_ERROR_STOP=1 --file /seeds/development.sql
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  demo-seed:
    image: meddesk-backend
    profiles: [tools]
    entrypoint: [/app/seed]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-meddesk}:${POSTGRES_PASSWORD:?Run make env}@postgres:5432/${POSTGRES_DB:-meddesk}?sslmode=disable
      DEMO_EMPLOYEE_PASSWORD: ${DEMO_EMPLOYEE_PASSWORD:-}
      DEMO_ENGINEER_PASSWORD: ${DEMO_ENGINEER_PASSWORD:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: "no"

volumes:
  postgres_data:
  media_data:
