server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    # Avoid logging query parameters or user-controlled URLs with secrets.
    access_log off;
    # Nginx request-level errors can include the raw URI/query; API logs are scrubbed.
    error_log /dev/null;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Docker DNS, refreshed after service recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /gateway-health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/v1/media {
        set $api_upstream http://backend:8081;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # This gateway is the only trusted hop; discard client-supplied chains.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        # Stream to the API before buffering: authorization precedes file bytes.
        client_max_body_size 502m;
        client_body_timeout 11m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 35m;
        proxy_send_timeout 11m;
        send_timeout 35m;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
    }

    location /api/ {
        set $api_upstream http://backend:8081;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # This gateway is the only trusted hop; discard client-supplied chains.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
    }

    location / {
        set $web_upstream http://frontend:8080;
        proxy_pass $web_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
    }
}
