version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema:
      - "db/migrations"
      - "db/sqlc"
    gen:
      go:
        package: "db"
        out: "internal/platform/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        omit_unused_structs: true
